<div class="auth-card">
	<span class="brand-mark">INTEG</span>
	<h2>Iniciar sesión</h2>
	<form [formGroup]="formGroupInput">
		<div class="mb-3">
			<label for="username" class="form-label">Usuario</label>
			<input type="text" id="username" class="form-control" formControlName="username" required />
		</div>
		<div class="mb-3">
			<label for="password" class="form-label">Contraseña</label>
			<input type="password" class="form-control" id="password" formControlName="password" required (keyup.enter)="signIn()" />
		</div>
		@if (status) {
			<div class="form-text text-danger">{{ status }}</div>
		}
		<div class="mb-4">
			<div class="form-check mb-2">
				<input type="checkbox" class="form-check-input" id="save" formControlName="save" />
				<label class="form-check-label" for="save">Recordarme</label>
			</div>
			<button type="button" class="btn btn-link btn-sm p-0" routerLink="/login/forgot-password">¿Olvidaste tu contraseña?</button>
		</div>
		<div class="d-grid gap-2">
			<button type="button" class="btn btn-brand" (click)="signIn()">Iniciar sesión</button>
		</div>
		<p class="signup-hint">¿No tienes cuenta? <button type="button" class="btn btn-link p-0" routerLink="/login/sign-up">Regístrate</button></p>
	</form>
</div>
